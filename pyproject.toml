[project]
name = "logsentinel"
version = "0.1.0"
description = "Log-based intrusion and anomaly detector with a Streamlit dashboard"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
